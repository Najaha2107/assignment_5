
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopNest - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <h1>Shop<span>Nest</span></h1>

        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
        >

        <button id="cartToggle">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </header>

   
    <section class="hero">
        <h2>Welcome to ShopNest!</h2>
        <p>Discover your favourite products at amazing prices.</p>
    </section>

 
    <main>
        <h2>Our Products</h2>

        <!-- Category Filters -->
        <div class="filters" id="categoryFilters">

            <button class="filter-btn active"
                    data-category="All">All</button>

            <button class="filter-btn"
                    data-category="Electronics">Electronics</button>

            <button class="filter-btn"
                    data-category="Clothing">Clothing</button>

            <button class="filter-btn"
                    data-category="Footwear">Footwear</button>

            <button class="filter-btn"
                    data-category="Books">Books</button>

        </div>

        <div id="productGrid" class="product-grid"></div>

        <p id="emptyMessage" hidden>
            No products found!
        </p>

        <p id="loadError" hidden>
            Unable to load products. Please try again.
        </p>

    </main>

    <!-- Shopping Cart -->
    <div id="cartBackdrop" class="cart-backdrop" hidden></div>

    <section id="cartDrawer" class="cart-drawer">

        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button id="closeCart">×</button>
        </div>

        <div id="cartItems"></div>

        <div class="cart-footer">
            <h3>Total: <span id="cartTotal">₹0</span></h3>

            <button id="checkoutButton">
                Checkout
            </button>
        </div>

    </section>

    <footer>
        <p>© 2026 ShopNest. All Rights Reserved.</p>
    </footer>

</body>
</html>
